name: Dalla Terra HYDRO-BLOK held wallboard public QA (backend HOLD)

# Manual-only, read-only regression of the company-8 public hold and image loads.
# A PASS is FRONTEND ONLY; backend/API/order-line write-time acceptance remains HOLD
# on issue #3 until separately tested. Do not convert this to push/schedule.
# NO login, no emails, no order, no booking and no Odoo writes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held-wallboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax of GET-only guards
        run: |
          node --check tests/held-wallboard-public-readonly.js
          node --check tests/held-wallboard-ssr-smoke.js
          node --check tests/unstocked-wallboard-search-readonly.js
      - name: Validate strict offline code and URL fixtures
        run: |
          node --test tests/vendor-sku-routing-no-email.test.js
          node --test tests/held-wallboard-parser.test.js
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Confirm interim SSR form suppression independently (GET only)
        run: node tests/held-wallboard-ssr-smoke.js ${{ matrix.browser }}
      - name: Verify exact unstocked SKU search banner and normal SKU control (GET only)
        run: node tests/unstocked-wallboard-search-readonly.js ${{ matrix.browser }}
      - name: Validate held SKU public frontend + image loads (backend still HOLD)
        run: node tests/held-wallboard-public-readonly.js ${{ matrix.browser }}
      - name: Store sanitized public screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dt8-hydroblok-held-guard-${{ matrix.browser }}
          path: qa-output-held-${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
